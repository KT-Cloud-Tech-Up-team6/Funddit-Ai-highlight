name: Build and Push

# 인프라팀 규격 (2026-09-24 전달):
#   - master push 에서만 OIDC 인증이 허용된다. PR·다른 브랜치는 거부된다
#   - environment: 를 넣으면 인증 조건이 바뀌어 거부된다 — 넣지 않는다
#   - AWS Access Key 불필요. GitHub OIDC 임시 인증만 쓴다
#   - ECR 저장소 fundit-ai-highlight, 태그 sha-<커밋>
on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # CUDA 베이스 이미지라 빌드가 무겁다. 캐시로 재빌드 시간을 줄인다.
      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::899957568205:role/fundit-ai-highlight-ci-role
          aws-region: ap-northeast-2

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/fundit-ai-highlight:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: |
          printf 'Image: `%s`\nCommit: `%s`\n' \
            "${{ steps.ecr.outputs.registry }}/fundit-ai-highlight:sha-${{ github.sha }}" \
            "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
